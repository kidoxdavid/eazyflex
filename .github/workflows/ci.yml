name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/eazyflex
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/eazyflex_test
  APP_SECRET: ci-secret-0123456789-abcdefghijklmnopqrstuvwxyz

jobs:
  verify:
    name: Typecheck, unit/integration tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - name: Create databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "create database eazyflex"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "create database eazyflex_test"
      - run: npm run typecheck
      - name: Migrations apply cleanly and the schema matches the code
        run: |
          npm run db:migrate
          npx drizzle-kit generate --name ci_drift_check
          git diff --exit-code -- drizzle || (echo "::error::schema.ts has changes without a migration" && exit 1)
      - run: npm test
      - run: npm run build
      - name: Dependency audit (production dependencies, high severity and above)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Browser journey, keyboard checks, axe accessibility audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -c "create database eazyflex"
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: ./scripts/e2e.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: accessibility-audit, path: docs/accessibility-audit.json, if-no-files-found: ignore }

  restore-drill:
    name: Backup, restore and erasure-survival drill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    env:
      ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - name: Install PostgreSQL 16 client tools (must match the server's major version)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -c "create database eazyflex"
      - run: npm run db:migrate && npm run db:seed
      - run: ./scripts/restore-drill.sh
